<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="vmx-data" content="">
<title>MISSION CONTROL · Neo HQ City</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/neohq.css">

<body>
<section class="stage" aria-label="Kota mini Mission Control">
  <canvas id="city" aria-label="Kota mini cyberpunk isometrik dengan markas, inti energi, dan teleporter"></canvas>
  <header class="hud glass">
    <div class="bar"><span>NEO HQ · DISTRIK 07</span><i class="blink"></i></div>
    <div class="in">
      <h1>MISSION CONTROL<small>MAVERICK HUNTER BASE · CHIBI CITY</small></h1>
      <div class="chips" id="chips"></div>
      <div class="sync" id="sync">Sinkron status…</div>
      <div class="links"><a href="credits.html">Credits</a> · <a href="?demo=1">demo</a> · <a href="classic.html">versi lama</a></div>
    </div>
  </header>
  <div class="tools">
    <button type="button" class="tool" id="zIn" aria-label="Zoom in">+</button>
    <button type="button" class="tool" id="zOut" aria-label="Zoom out">−</button>
    <button type="button" class="tool" id="fit" title="Lihat seluruh kota">FIT</button>
    <button type="button" class="tool" id="rain" aria-pressed="true">HUJAN</button>
    <button type="button" class="tool snd" id="muteBtn" title="Musik on/off" aria-label="Musik" aria-pressed="true"><svg viewBox="0 0 12 10" width="15" height="13" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 3h3v4H0zM3 2h1v6H3zM4 1h1v8H4zM5 0h1v10H5z" fill="currentColor"/><g class="on"><path d="M7 3h1v4H7zM9 1h1v2H9zM10 3h1v4h-1zM9 7h1v2H9z" fill="currentColor"/></g><g class="off"><path d="M7 2h1v1H7zM8 3h1v1H8zM9 4h1v2H9zM10 3h1v1h-1zM11 2h1v1h-1zM8 6h1v1H8zM7 7h1v1H7zM10 6h1v1h-1zM11 7h1v1h-1z" fill="#ff3ea5"/></g></svg></button>
  </div>
  <aside class="crew glass" aria-label="Kru">
    <div class="bar"><span>KRU <span id="ccount"></span></span><button type="button" class="mini-btn" id="crewToggle" aria-expanded="true">–</button></div>
    <ul id="crew"></ul>
  </aside>
  <section class="info glass" id="info" hidden aria-live="polite">
    <div class="bar"><span>PROFIL KRU</span><button type="button" class="x" id="infoX" aria-label="Tutup">✕</button></div>
    <div class="in" id="infoBody"></div>
  </section>
  <p class="note">Geser untuk pindah · scroll/pinch untuk zoom · klik kru untuk menyapa</p>
</section>
<noscript><p class="nojs">Markas butuh JavaScript.</p></noscript>
<div class="err glass" id="err" hidden></div>
<script type="module" src="js/neohq.js"></script>
</body>
